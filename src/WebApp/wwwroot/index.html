<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oilfield SCADA</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Yacimiento — Vista general</h1>
    <span id="conn-status">conectando</span>
  </header>
  <main>
    <section id="main-grid" class="grid grid-main"></section>
    <section id="compact-grid" class="grid grid-compact"></section>
    <section id="trend" class="card">
      <div class="card-head">
        <span class="card-title" id="trend-title">—</span>
        <span id="trend-windows"></span>
      </div>
      <div class="chart-body">
        <canvas id="trend-canvas"></canvas>
      </div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
